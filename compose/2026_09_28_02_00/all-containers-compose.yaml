version: '3.8'

services:
  nginx-reverse-proxy:
    image: nginx:alpine-slim
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - web-tier-network

  postgres-master-db:
    image: postgres:16-alpine
    container_name: postgres-master-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: appdb
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - database-bridge

networks:
  web-tier-network:
    external: true
  database-bridge:
    external: true
